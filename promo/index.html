  oc.querySelectorAll('.ochip').forEach(c => Object.assign(c.style, { fontSize: L.tagEn + 'px', padding: `${L.tagEn * 0.36}px ${L.tagEn * 0.8}px`, borderWidth: '2px' }));
  txt($('chipCount'), `${COMBOS.length} kombinacij`);
  Object.assign($('cta').style, { fontSize: L.tagSi * 1.05 + 'px', padding: `${L.tagSi * 0.42}px ${L.tagSi * 0.9}px`, gap: L.tagSi * 0.32 + 'px', marginTop: L.tagSi * 1.25 + 'px' });
  const ci = $('cta').querySelector('svg');
  ci.style.width = ci.style.height = L.tagSi * 0.9 + 'px';
  txt($('ctaSi'), CTA.si);
  Object.assign($('ctaEn').style, { fontSize: L.tagEn * 0.95 + 'px', marginTop: L.tagEn * 0.5 + 'px' });
  txt($('ctaEn'), CTA.en);

  // bubble
  const b = $('bubble'), bs = L.bubble.size;
  Object.assign(b.style, { padding: `${bs * 0.26}px ${bs * 0.6}px ${bs * 0.26}px ${bs * 0.26}px`, gap: bs * 0.32 + 'px' });
  const bm = b.querySelector('.bmic');
  Object.assign(bm.style, { width: bs * 1.25 + 'px', height: bs * 1.25 + 'px', fontSize: bs * 0.66 + 'px' });
  b.querySelector('.btext').style.fontSize = bs + 'px';
  b.querySelector('.wave').style.gap = bs * 0.09 + 'px';
  b.querySelector('.wave').style.height = bs * 0.8 + 'px';
  b.querySelectorAll('.wave i').forEach(i => { i.style.width = bs * 0.1 + 'px'; });
  Object.assign(b.querySelector('.tail').style, { width: bs * 0.5 + 'px', height: bs * 0.5 + 'px', right: -bs * 0.12 + 'px', top: `calc(50% - ${bs * 0.25}px)` });
}

// ═══════════════════════════════════════════════════════════════
//  Render one frame at time t (seconds) — fully deterministic
// ═══════════════════════════════════════════════════════════════
let stageScale = 1;
function phoneState(t) {
  const rise = 1 - eo(p(t, 1.85, 2.8));
  const exit = eio(p(t, T.outro, T.outro + 0.75));
  const kick = pulse(t, T.bell, 0.35) * 0.012;
  return {
    y: L.phoneTop + rise * 760 + exit * (L.H - L.phoneTop + 120) + Math.sin(t * 1.15) * 5 * (1 - exit),
    scale: 1 + kick - exit * 0.06,
    op: p(t, 1.85, 2.25) * (1 - p(t, T.outro + 0.35, T.outro + 0.75)),
  };
}

function renderBg(t) {
  const ph = phoneState(t);
  const cx = L.W / 2, cy = Math.min(ph.y, L.phoneTop + 200) + SH * L.S * 0.42;
  const bellGlow = pulse(t, T.bell, 1.2);
  const a = $('glowA');
  set(a, 'left', cx - 750 + Math.sin(t * 0.4) * 40 + 'px');
  set(a, 'top', (t < 2 ? L.H * 0.42 : cy) - 750 + 'px');
  set(a, 'opacity', String(0.75 + 0.25 * Math.sin(t * 0.9) * 0.4 + bellGlow * 0.5));
  const b = $('glowB');
  set(b, 'left', -300 + Math.sin(t * 0.3) * 60 + 'px');
  set(b, 'top', -350 + Math.cos(t * 0.25) * 50 + 'px');
  // shockwave on the round bell
  const sh = $('shock'), x = p(t, T.bell, T.bell + 1.1);
  if (x > 0 && x < 1) {
    const r = lerp(170 * L.S, 760, eo(x));
    const rc = ringCenter();
    Object.assign(sh.style, { display: 'block', width: r * 2 + 'px', height: r * 2 + 'px', left: rc.x - r + 'px', top: rc.y - r + 'px', opacity: String((1 - x) * 0.55), borderWidth: lerp(10, 2, x) + 'px' });
  } else set(sh, 'display', 'none');
}

function ringCenter() {
  const r = $('ringwrap').getBoundingClientRect(), s = $('stage').getBoundingClientRect();
  return { x: (r.x + r.width / 2 - s.x) / stageScale, y: (r.y + r.height / 2 - s.y) / stageScale };
}

function renderIntro(t) {
  const el = $('intro');
  const out = eio(p(t, 1.7, 2.25));
  set(el, 'opacity', String(1 - out));
  set(el, 'transform', `translateY(${-out * 120}px)`);
  set(el, 'display', t > 2.3 ? 'none' : 'flex');
  const lg = el.querySelector('.logo'), x = p(t, 0.1, 0.75);
  set(lg, 'transform', `scale(${lerp(0.55, 1, back(x))})`);
  set(lg, 'opacity', String(p(t, 0.1, 0.35)));
  el.querySelectorAll('.word span').forEach((s, i) => {
    const y = eo(p(t, 0.38 + i * 0.035, 0.85 + i * 0.035));
    set(s, 'transform', `translateY(${(1 - y) * 110}%)`);
  });
  const si = el.querySelector('.tag-si'), en = el.querySelector('.tag-en');
  set(si, 'opacity', String(p(t, 0.75, 1.1))); set(si, 'transform', `translateY(${(1 - eo(p(t, 0.75, 1.15))) * 20}px)`);
  set(en, 'opacity', String(p(t, 0.9, 1.25))); set(en, 'transform', `translateY(${(1 - eo(p(t, 0.9, 1.3))) * 20}px)`);
}

function renderOutro(t) {
  const el = $('outro');
  const on = t > T.outro + 0.3;
  set(el, 'display', on ? 'flex' : 'none');
  if (!on) return;
  const a = T.outro + 0.45;
  const lg = el.querySelector('.logo'), x = p(t, a, a + 0.65);
  set(lg, 'transform', `scale(${lerp(0.55, 1, back(x))})`);
  set(lg, 'opacity', String(p(t, a, a + 0.25)));
  const w = el.querySelector('.word');
  w.querySelectorAll('span').forEach((s, i) => {
    const y = eo(p(t, a + 0.25 + i * 0.06, a + 0.75 + i * 0.06));
    set(s, 'transform', `translateY(${(1 - y) * 110}%)`);
  });
  const si = el.querySelector('.tag-si'), en = el.querySelector('.tag-en');
  set(si, 'opacity', String(p(t, a + 0.6, a + 0.95))); set(si, 'transform', `translateY(${(1 - eo(p(t, a + 0.6, a + 1.0))) * 20}px)`);
  set(en, 'opacity', String(p(t, a + 0.72, a + 1.05))); set(en, 'transform', `translateY(${(1 - eo(p(t, a + 0.72, a + 1.1))) * 20}px)`);
  el.querySelectorAll('.ochip').forEach((c, i) => {
    const y = p(t, a + 1.0 + i * 0.1, a + 1.45 + i * 0.1);
    set(c, 'opacity', String(clamp(y * 2)));
    set(c, 'transform', `scale(${lerp(0.7, 1, back(y))})`);
  });
  const c = p(t, a + 1.45, a + 1.95), breathe = t > a + 2.1 ? Math.sin((t - a - 2.1) * 4) * 0.025 : 0;
  set($('cta'), 'opacity', String(clamp(c * 2)));
  set($('cta'), 'transform', `scale(${lerp(0.6, 1, back(c)) + breathe})`);
  set($('ctaEn'), 'opacity', String(p(t, a + 1.7, a + 2.05)));
}

function renderCaptions(t) {
  CAPTIONS.forEach((c, i) => {
    const el = $('cap' + i);
    const vis = t > c.a - 0.05 && t < c.b + 0.05;
    set(el, 'display', vis ? 'block' : 'none');
    if (!vis) return;
    const outX = eio(p(t, c.b - 0.32, c.b));
    el.querySelectorAll('.line > span').forEach((s, j) => {
      const inX = eo(p(t, c.a + j * 0.08, c.a + 0.55 + j * 0.08));
      set(s, 'transform', `translateY(${(1 - inX) * 108 - outX * 108}%)`);
    });
  });
}

function renderPhone(t) {
  const ph = phoneState(t), el = $('phone');
  set(el, 'transform', `translate(${+el.dataset.left}px, ${ph.y}px) scale(${ph.scale})`);
  set(el, 'opacity', String(ph.op));
  set(el, 'display', ph.op <= 0 ? 'none' : 'block');
}

function screenOpacity(t, a, b) { return p(t, a, a + 0.2) * (t < b + 0.2 ? 1 : 0); }

function renderScreens(t) {
  const sc = [['scrFilters', -1, T.toSession], ['scrSession', T.toSession, T.toTimer], ['scrTimer', T.toTimer, T.toStats], ['scrStats', T.toStats, 99]];
  sc.forEach(([id, a, b]) => {
    const o = a < 0 ? (t < b + 0.2 ? 1 : 0) : screenOpacity(t, a, b);
    set($(id), 'opacity', String(o));
    set($(id), 'display', o > 0 ? 'block' : 'none');
  });
  if (t < T.toSession + 0.25) renderFilters(t);
  if (t > T.toSession - 0.05 && t < T.toTimer + 0.25) renderSession(t);
  if (t > T.toTimer - 0.05 && t < T.toStats + 0.25) renderTimer(t);
  if (t > T.toStats - 0.05) renderStats(t);
}

function renderFilters(t) {
  const on = (k) => t >= T[k];
  ['chipInt', 'chipAdv', 'chipKicks', 'chipKnees'].forEach(k => cls($(k), 'on', on(k)));
  const diffs = [on('chipInt') && 'int', on('chipAdv') && 'adv'].filter(Boolean);
  const types = [on('chipKicks') && 'kicks', on('chipKnees') && 'knees'].filter(Boolean);
  txt($('match'), `${matching(diffs, types)} combos match`);
}

function renderSession(t) {
  SESSION.forEach((c, i) => {
    const card = $('card' + i);
    const k = eo(p(t, T.toSession + i * 0.035, T.toSession + 0.35 + i * 0.035));
    set(card, 'opacity', String(k));
    set(card, 'transform', `translateY(${(1 - k) * 16}px)`);
    const o = OPEN[i];
    const isOpen = o && t >= o[0] && t < o[1];
    cls(card, 'x', isOpen);
    if (o) {
      const body = $('cbody' + i);
      const e = eio(p(t, o[0], o[0] + 0.26)) * (1 - eio(p(t, o[1], o[1] + 0.22)));
      set(body, 'height', (e * +body.dataset.full).toFixed(2) + 'px');
      set(body, 'opacity', String(clamp(e * 1.4 - 0.2)));
      set($('tbar' + i), 'width', clamp(100 - (t - o[0]) / 60 * 100, 0, 100) + '%');
    }
    const done = DONE_AT[i] != null && t >= DONE_AT[i];
    cls($('cname' + i), 'done', done && !isOpen);
    set($('cdone' + i), 'display', done && !isOpen ? 'block' : 'none');
    const h = $('cheart' + i), fav = HEART_AT[i] != null && t >= HEART_AT[i];
    cls(h, 'on', fav);
    html(h, ion(fav ? 'heart' : 'heart-outline'));
    set(h, 'transform', fav ? `scale(${1 + pulse(t, HEART_AT[i], 0.32) * 0.45})` : 'none');
  });
  txt($('subS'), `10 combos · ${t >= DONE_AT[0] ? 1 : 0} done`);
  // pill disappears once a timer runs (the clock replaces it)
  set($('pillS'), 'visibility', t >= T.timerLive ? 'hidden' : 'visible');
  // mic
  const m = $('micS'), on = t >= T.micOn;
  cls(m, 'on', on);
  html(m, on ? `${ion('mic')}<span class="miclabel">Listening: “combo 3” / “set 2 min countdown”</span>`
             : `${ion('mic-outline')}<span class="miclabel">Tap to listen for voice commands</span>`);
  const st = $('statusS');
  const line = t >= T.heard3 ? ['✓ Timer started', true] : t >= T.heard2 ? ['heard: combo next', false] : t >= T.heard1 ? ['heard: combo 3', false] : null;
  set(st, 'height', (line ? eo(p(t, T.heard1, T.heard1 + 0.15)) * 17.5 : 0) + 'px');
  if (line) { txt(st.firstChild, line[0]); cls(st, 'fb', line[1]); }
}

function renderTimer(t) {
  const prep = t < T.bell;
  const r = T.bell - t;                         // lead-in seconds left
  const w = 180 - (t - T.bell);                 // round seconds left
  const color = prep ? '#EF9F27' : '#E86C3A';
  const ph = $('phase');
  txt(ph, prep ? 'GET READY' : 'ROUND 1 OF 5'); set(ph, 'color', color);
  const d = $('digits');
  if (prep) {
    txt(d, String(Math.max(1, Math.ceil(r))));
    Object.assign(d.style, { fontSize: '149.5px', lineHeight: '149.5px', fontWeight: '200', color: '#EF9F27' });
    txt($('under'), 'Round 1 of 5');
  } else {
    txt(d, clock(Math.ceil(w)));
    Object.assign(d.style, { fontSize: '94.8px', lineHeight: '94.8px', fontWeight: '300', color: '#fff' });
    txt($('under'), 'of 3:00');
  }
  const frac = prep ? r / 10 : lerp(0, w / 180, eo(p(t, T.bell, T.bell + 0.4)));
  const ring = $('ring');
  set(ring, 'stroke', color);
  ring.setAttribute('stroke-dashoffset', (628.3 * (1 - clamp(frac))).toFixed(2));
  set(ring, 'opacity', frac > 0.002 ? '1' : '0');
  set($('belowPrep'), 'display', prep ? 'flex' : 'none');
  set($('belowWork'), 'display', prep ? 'none' : 'flex');
  txt($('left'), clock(Math.ceil(w) + 1200));
  set($('pauseBtn'), 'background', color);
  const tintA = prep ? 0.12 : 0.12 * (1 - p(t, T.bell, T.bell + 0.25));
  set($('tint'), 'background', `radial-gradient(ellipse 493px 569px at 50% 40%, rgba(239,159,39,${tintA}) 0%, rgba(239,159,39,0) 70%)`);
}

function renderStats(t) {
  const a = T.toStats + 0.1;
  const flame = $('flame');
  set(flame, 'transform', `scale(${1 + pulse(t, a + 0.1, 0.4) * 0.35})`);
  txt($('skn'), String(Math.max(1, Math.min(3, Math.floor(lerp(1, 3.99, p(t, a, a + 0.45)))))));
  [0, 1].forEach(i => {
    const at = a + 0.3 + i * 0.22, on = t >= at, dot = $('wk' + i);
    cls(dot, 'on', on);
    html(dot, on ? ti('checkBold', 12) : '');
    set(dot, 'transform', `scale(${1 + pulse(t, at, 0.3) * 0.3})`);
  });
  const k = eo(p(t, a + 0.2, a + 1.2));
  const min = Math.round(84 * k);
  txt($('tv0'), min < 60 ? `${min} m` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')} m`);
  txt($('tv1'), String(Math.round(10 * k)));
  txt($('tv2'), String(Math.round(18 * k)));
  txt($('tv3'), String(Math.round(4 * k)));
  for (let i = 0; i < 4; i++) set($('td' + i), 'opacity', String(p(t, a + 0.9, a + 1.3)));
  const base = +$('chart').dataset.base;
  WEEKS.forEach((v, i) => {
    const b = $('bar' + i), full = +b.dataset.h;
    const g = eo(p(t, a + 0.35 + i * 0.05, a + 0.9 + i * 0.05));
    b.setAttribute('height', (full * g).toFixed(2));
    b.setAttribute('y', (base - full * g).toFixed(2));
  });
  $('avg').setAttribute('opacity', p(t, a + 1.0, a + 1.3).toFixed(3));
  $('pick').setAttribute('opacity', p(t, a + 1.0, a + 1.2).toFixed(3));
  const sc = eio(p(t, a + 2.0, a + 3.1));
  set($('sscroll'), 'transform', `translateY(${-sc * 300}px)`);
  for (let i = 0; i < 5; i++) {
    const m = $('mx' + i);
    set(m, 'width', (+m.dataset.v * eo(p(t, a + 2.3 + i * 0.07, a + 2.9 + i * 0.07)) * 100) + '%');
  }
}

function renderTabs(t) {
  const active = t < T.toTimer ? 0 : t < T.toStats ? 1 : 3;
  for (let k = 0; k < 5; k++) cls($('tab' + k), 'on', k === active);
  const tl = $('tl1'), icon = $('tab1').querySelector('.ion');
  let label = 'Timer', live = false, color = '';
  if (t >= T.timerLive && t < T.toTimer) { label = clock(Math.ceil(10 - (t - T.timerLive))); live = true; color = '#EF9F27'; }
  else if (t >= T.toTimer && t < T.toStats) {
    live = true;
    label = t < T.bell ? clock(Math.ceil(T.bell - t)) : clock(Math.ceil(180 - (t - T.bell)));
  } else if (t >= T.toStats) { live = true; color = '#E86C3A'; label = `R1 · ${clock(Math.ceil(180 - (t - T.bell)))}`; }
  txt(tl, label); cls(tl, 'live', live);
  set(tl, 'color', color); set(icon, 'color', color);
}

function renderTap(t) {
  const tap = $('tap');
  const cur = TAPS.find(x => t > x.t - 0.12 && t < x.t + 0.5);
  if (!cur) { set(tap, 'opacity', '0'); return; }
  const el = $(cur.id), r = el.getBoundingClientRect(), s = $('screen').getBoundingClientRect();
  const k = s.width / SW;
  const x = (r.x + r.width / 2 - s.x) / k, y = (r.y + r.height / 2 - s.y) / k;
  set(tap, 'left', x + 'px'); set(tap, 'top', y + 'px');
  const down = eo(p(t, cur.t - 0.12, cur.t));
  const up = p(t, cur.t + 0.12, cur.t + 0.5);
  set(tap, 'opacity', String(down * (1 - up)));
  set(tap, 'transform', `scale(${lerp(0.6, 1, down) + up * 0.35})`);
}

function renderBubbles(t) {
  const b = $('bubble');
  const cur = BUBBLES.find(x => t > x.a && t < x.b);
  if (!cur) { set(b, 'display', 'none'); return; }
  set(b, 'display', 'flex');
  txt($('btext'), cur.text);
  const ph = phoneState(t);
  const y = ph.y + BZ + (28 + L.bubble.dpY) * L.S;
  set(b, 'left', L.bubble.x + 'px'); set(b, 'top', y + 'px');
  const i = p(t, cur.a, cur.a + 0.45), o = p(t, cur.b - 0.25, cur.b);
  set(b, 'opacity', String(clamp(i * 3) * (1 - o)));
  set(b, 'transform', `translateY(${o * -24}px) scale(${lerp(0.6, 1, back(i))})`);
  b.querySelectorAll('.wave i').forEach((w, j) => {
    const talk = p(t, cur.a + 0.2, cur.a + 0.3) * (1 - p(t, cur.a + 0.9, cur.a + 1.1));
    const h = 0.22 + talk * (0.5 + 0.5 * Math.sin(t * 18 + j * 1.7)) * 0.78;
    set(w, 'height', (h * L.bubble.size * 0.8).toFixed(1) + 'px');
  });
}

function renderAt(t) {
  renderPhone(t);
  renderScreens(t);
  renderTabs(t);
  renderBg(t);
  renderIntro(t);
  renderCaptions(t);
  renderBubbles(t);
  renderTap(t);
  renderOutro(t);
}

// ═══════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════
async function boot() {
  buildFilters(); buildSession(); buildTimer(); buildStats(); buildTabs(); buildCaptions();
  document.querySelectorAll('.ion[data-i]').forEach(i => { if (!i.textContent) i.textContent = String.fromCodePoint(GLYPH[i.dataset.i]); });
  layout();
  await Promise.all([
    document.fonts.load('800 80px "Barlow Condensed"'), document.fonts.load('700 80px "Barlow Condensed"'),
    document.fonts.load('500 30px Barlow'), document.fonts.load('600 30px Barlow'), document.fonts.load('300 20px Roboto'), document.fonts.load('200 20px Roboto'), document.fonts.load('400 20px Roboto'),
    document.fonts.load('500 20px Roboto'), document.fonts.load('600 20px Roboto'), document.fonts.load('700 20px Roboto'),
    document.fonts.load('24px Ionicons'),
  ]);
  await document.fonts.ready;
  // natural heights of the expandable card bodies
  Object.keys(OPEN).forEach(i => {
    const b = $('cbody' + i);
    b.style.height = 'auto'; b.dataset.full = b.offsetHeight; b.style.height = '0px';
  });
  window.DUR = DUR;
  window.AUDIO = AUDIO;
  if (Q.has('render')) {
    document.body.classList.add('rendering');
    window.renderAt = renderAt;
    renderAt(0);
    window.READY = true;
    return;
  }
  // preview: fit to window, play/scrub
  const fit = () => { stageScale = Math.min(innerWidth / L.W, (innerHeight - 50) / L.H); $('fit').style.transform = `scale(${stageScale})`; };
  fit(); addEventListener('resize', fit);
  let playing = !Q.has('t'), t0 = performance.now() - (+Q.get('t') || 0) * 1000, tNow = +Q.get('t') || 0;
  const scrub = $('scrub'); scrub.max = DUR;
  $('play').onclick = () => { playing = !playing; t0 = performance.now() - tNow * 1000; $('play').textContent = playing ? '❚❚' : '▶'; };
  scrub.oninput = () => { tNow = +scrub.value; t0 = performance.now() - tNow * 1000; renderAt(tNow); $('tlabel').textContent = tNow.toFixed(2); };
  $('play').textContent = playing ? '❚❚' : '▶';
  const loop = () => {
    if (playing) { tNow = ((performance.now() - t0) / 1000) % DUR; renderAt(tNow); scrub.value = tNow; $('tlabel').textContent = tNow.toFixed(2); }
    requestAnimationFrame(loop);
  };
  renderAt(tNow); loop();
  window.renderAt = renderAt; window.READY = true;
}
boot();
</script>
